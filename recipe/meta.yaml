{% set name = "types-pytz" %}
{% set version = "2026.6.0.20261031" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8b559955f0c628f68159865c6f24835f4323c407a4408365b3676a074b524261

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=82.0.1
  run:
    - python

test:
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - test -f $SP_DIR/pytz-stubs/__init__.pyi  # [not win]
    - if not exist %SP_DIR%\pytz-stubs\__init__.pyi exit 1  # [win]

about:
  home: https://github.com/python/typeshed
  summary: This is a type stub package for the pytz package. It can be used by type checkers to check code that uses pytz.
  description: This is a type stub package for the pytz package. It can be used by type checkers to check code that uses pytz.
  license: Apache-2.0 AND MIT
  license_family: Other
  license_file: LICENSE
  dev_url: https://github.com/python/typeshed
  doc_url: https://typing.python.org

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
  skip-lints:
    - missing_imports_or_run_test_py
